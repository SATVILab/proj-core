name: Test Installation Methods

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Test Debian package installation
  test-debian-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          install-only: true
          version: '~> v1'

      - name: Build Debian package
        run: |
          goreleaser release --snapshot --clean

      - name: Install APT repository prerequisites for dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg

      - name: Add MiguelRodo APT repository
        run: |
          curl -fsSL https://miguelrodo.github.io/apt-miguelrodo/KEY.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-miguelrodo.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-miguelrodo.gpg] https://miguelrodo.github.io/apt-miguelrodo stable main" \
            | sudo tee /etc/apt/sources.list.d/apt-miguelrodo.list >/dev/null
          sudo apt-get update

      - name: Install Debian package
        run: |
          sudo dpkg -i dist/*_amd64.deb || true
          sudo apt-get install -f -y

      - name: Verify setupmjr command is available
        run: |
          which setupmjr
          setupmjr --help || true
          echo "setupmjr command is available"

  # Test local installation (Ubuntu without sudo)
  test-local-installation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build fake release binary
        run: |
          mkdir -p /tmp/fake-release
          cd cmd/setupmjr
          GOOS=linux GOARCH=amd64 go build -o /tmp/fake-release/setupmjr_linux_amd64 .

      - name: Run local installation script
        env:
          SETUPMJR_DOWNLOAD_BASE_URL: "file:///tmp/fake-release"
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          bash install-local.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify setupmjr command is available
        run: |
          which setupmjr
          setupmjr --help || true
          echo "setupmjr command is available"

      - name: Verify script installation
        run: |
          test -f $HOME/.local/bin/setupmjr || (echo "Failed" && exit 1)
          test -x $HOME/.local/bin/setupmjr || (echo "Failed" && exit 1)
          echo "Local installation test passed"

      - name: Test setupmjr functionality
        run: |
          # Test that setupmjr command works
          setupmjr --help || true
          echo "setupmjr functionality works"

  # Test installation from published APT repository
  test-apt-repo-installation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install APT repository prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg

      - name: Add MiguelRodo APT repository
        run: |
          curl -fsSL https://miguelrodo.github.io/apt-miguelrodo/KEY.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-miguelrodo.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-miguelrodo.gpg] https://miguelrodo.github.io/apt-miguelrodo stable main" \
            | sudo tee /etc/apt/sources.list.d/apt-miguelrodo.list >/dev/null

      - name: Install setupmjr from APT
        run: |
          sudo apt-get update
          sudo apt-get install -y setupmjr

      - name: Verify installed binary and architecture
        run: |
          setupmjr --help || true
          PKG_ARCH="$(dpkg-query -W -f='${Architecture}' setupmjr)"
          HOST_ARCH="$(dpkg --print-architecture)"
          if [ "$PKG_ARCH" = "all" ]; then
            echo "Error: expected architecture-specific package, got Architecture: all"
            exit 1
          fi
          if [ "$PKG_ARCH" != "$HOST_ARCH" ]; then
            echo "Error: installed package architecture ($PKG_ARCH) does not match host ($HOST_ARCH)"
            exit 1
          fi
          echo "Installed package architecture: $PKG_ARCH"
          echo "APT repository installation test passed"

  # Test Windows manual installation
  test-windows-manual:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build fake release binary
        shell: pwsh
        run: |
          $fakeRelease = Join-Path $env:TEMP "fake-release"
          New-Item -ItemType Directory -Path $fakeRelease -Force | Out-Null
          Set-Location cmd/setupmjr
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o (Join-Path $fakeRelease "setupmjr_windows_amd64.exe") .
          Write-Host "Fake release binary built"

      - name: Run install.ps1
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $env:Path = "$installDir;$env:Path"
          $fakeRelease = Join-Path $env:TEMP "fake-release"
          $env:SETUPMJR_DOWNLOAD_BASE_URL = "file:///$($fakeRelease -replace '\\', '/')"
          .\install.ps1
          Write-Host "Installation script executed"

      - name: Verify setupmjr is in PATH (new session)
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          $env:Path = "$installDir;$env:Path"
          if (Test-Path (Join-Path $installDir "setupmjr.exe")) {
            Write-Host "setupmjr.exe installed to writable PATH directory"
          } else {
            Write-Error "setupmjr.exe not found in expected install directory"
            throw "Failed"
          }

      - name: Test setupmjr command
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          $env:Path = "$installDir;$env:Path"
          & (Join-Path $installDir "setupmjr.exe") --help; if ($LASTEXITCODE -ne 0) { Write-Host "Help printed with exit code $LASTEXITCODE" }
          Write-Host "Windows manual installation test passed"

  # Test from source (Go binary)
  test-from-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl

      - name: Build setupmjr binary from source
        run: |
          cd cmd/setupmjr
          go build -o /tmp/setupmjr .
          /tmp/setupmjr --help || true
          echo "From source binary test passed"

  # Summary job to ensure all tests pass
  test-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-debian-package, test-local-installation, test-apt-repo-installation, test-windows-manual, test-from-source]
    if: always()

    steps:
      - name: Check all tests passed
        run: |
          if [ "${{ needs.test-debian-package.result }}" != "success" ]; then
            echo "Debian package tests failed"
            exit 1
          fi
          if [ "${{ needs.test-local-installation.result }}" != "success" ]; then
            echo "Local installation tests failed"
            exit 1
          fi
          if [ "${{ needs.test-apt-repo-installation.result }}" != "success" ]; then
            echo "APT repository installation tests failed"
            exit 1
          fi
          if [ "${{ needs.test-windows-manual.result }}" != "success" ]; then
            echo "Windows manual tests failed"
            exit 1
          fi
          if [ "${{ needs.test-from-source.result }}" != "success" ]; then
            echo "From source tests failed"
            exit 1
          fi
          echo "✅ All installation methods tested successfully!"
