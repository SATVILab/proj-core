name: Test Installation Methods

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:

  test-local-installation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bash

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build fake release binary
        run: |
          mkdir -p /tmp/fake-release
          cargo build --release
          # Mock the release action string structure for testing the installer
          cp target/release/proj /tmp/fake-release/proj_linux_amd64

      - name: Run local installation script
        env:
          PROJ_DOWNLOAD_BASE_URL: "file:///tmp/fake-release"
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          bash install-local.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify proj command is available
        run: |
          which proj
          proj --help || true
          test -f $HOME/.local/bin/proj
          test -x $HOME/.local/bin/proj
          echo "Local Unix installation test passed successfully."

  test-debian-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb tool
        run: cargo install cargo-deb --locked

      - name: Compile and Build Debian Package
        run: |
          mkdir -p dist
          cargo deb --output dist/

      - name: Install APT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg

      - name: Add MiguelRodo Managed APT Repository
        run: |
          curl -fsSL https://miguelrodo.github.io/apt-miguelrodo/KEY.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-miguelrodo.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-miguelrodo.gpg] https://miguelrodo.github.io/apt-miguelrodo stable main" \
            | sudo tee /etc/apt/sources.list.d/apt-miguelrodo.list >/dev/null
          sudo apt-get update

      - name: Install generated .deb artifact
        run: |
          sudo dpkg -i dist/*.deb || true
          sudo apt-get install -f -y

      - name: Verify debian execution profile
        run: |
          which proj
          proj --help || true

  test-windows-manual:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build fake release binary for Windows architecture
        shell: pwsh
        run: |
          $fakeRelease = Join-Path $env:TEMP "fake-release"
          New-Item -ItemType Directory -Path $fakeRelease -Force | Out-Null
          cargo build --release
          Copy-Item "target\release\proj.exe" -Destination (Join-Path $fakeRelease "proj_windows_amd64.exe") -Force
          Write-Host "Fake release binary built for Windows testing environment"

      - name: Run install.ps1 script execution pass
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $env:Path = "$installDir;$env:Path"
          $fakeRelease = Join-Path $env:TEMP "fake-release"
          $env:PROJ_DOWNLOAD_BASE_URL = "file:///$($fakeRelease -replace '\\', '/')"
          .\install.ps1
          Write-Host "Windows manual installation script pass complete"

      - name: Verify installed target binary state in PATH environment
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          if (Test-Path (Join-Path $installDir "proj.exe")) {
            Write-Host "proj.exe verified in write targets."
          } else {
            Write-Error "proj.exe missing from installation target destination paths"
            throw "Failed"
          }

  test-from-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile and check binary execution boundaries
        run: |
          cargo build --release
          ./target/release/proj --help || true
          echo "From source raw target execution block validated successfully."

  test-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-local-installation, test-debian-package, test-windows-manual, test-from-source]
    if: always()

    steps:
      - name: Evaluate execution summary matrix statuses
        run: |
          if [ "${{ needs.test-local-installation.result }}" != "success" ]; then
            echo "Local script installation step matrix broken."
            exit 1
          fi
          if [ "${{ needs.test-debian-package.result }}" != "success" ]; then
            echo "Debian compilation packaging pipeline step broken."
            exit 1
          fi
          if [ "${{ needs.test-windows-manual.result }}" != "success" ]; then
            echo "Windows native install script tracking pass failed."
            exit 1
          fi
          if [ "${{ needs.test-from-source.result }}" != "success" ]; then
            echo "Source environment compilation matrix failed."
            exit 1
          fi
          echo "✅ Complete compilation & environmental deployment methods tested completely."
